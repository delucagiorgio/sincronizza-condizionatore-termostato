blueprint:
  name: Sync an air conditioner with a room thermostat
  description: >-
    Makes a split air conditioner follow the room thermostat, so the
    thermostat stays the single place you touch.

    Four rules. The AC mirrors the thermostat's mode (off / heat / cool) and
    its target temperature. Opening the window switches the AC off, closing
    it switches the AC back on — unless the thermostat was turned off in the
    meantime. When the house is empty and the thermostat is switched on, the
    thermostat is moved to its "away" preset. When the house is occupied and
    the thermostat is switched on while still sitting in "away", it is moved
    back to your normal preset.

    That last rule is the one people usually miss. A presence automation
    that only clears "away" on arrival will skip a thermostat that happens
    to be off at that moment — for instance because a schedule turned it off
    while you were out — and "away" then stays stuck on the device. The next
    time you switch the thermostat on it starts at the away temperature
    instead of yours.

    The target temperature is written to the AC only when it actually
    differs from the value already set, so a thermostat that reports small
    changes does not produce a stream of redundant commands.

    Everything is referenced by entity_id, never device_id, so the
    automation survives removing and re-pairing a device.

    Synchronisation is one-way, thermostat to AC. See the README for why the
    reverse direction is not trivial.
  domain: automation
  author: delucagiorgio
  source_url: https://github.com/delucagiorgio/sincronizza-condizionatore-termostato/blob/main/thermostat_ac_sync_blueprint/sincronizza_condizionatore_con_termostato.yaml
  homeassistant:
    min_version: "2024.10.0"
  input:
    stanza:
      name: Room entities
      icon: mdi:home-thermometer
      input:
        termostato:
          name: Thermostat
          description: >-
            The room thermostat. It is the source of truth: its mode
            (off/heat/cool) and its target temperature are mirrored onto the
            air conditioner.
          selector:
            entity:
              filter:
                domain: climate
        condizionatore:
          name: Air conditioner
          description: The air conditioner that has to follow the thermostat.
          selector:
            entity:
              filter:
                domain: climate
        sensore_finestra:
          name: Window sensor
          description: >-
            When it opens, the air conditioner is switched off. When it
            closes, the air conditioner is switched back on — but only if the
            thermostat was not turned off in the meantime. Must be a
            binary_sensor with device class "window".
          selector:
            entity:
              filter:
                domain: binary_sensor
                device_class: window
    presenza:
      name: Presence
      icon: mdi:account-question
      collapsed: true
      input:
        helper_presenza:
          name: Presence helper
          description: >-
            An input_select that tells whether the house is occupied. The
            same helper is normally shared by every room.
          selector:
            entity:
              filter:
                domain: input_select
        stato_assenti:
          name: Value that means "nobody home"
          description: >-
            The option of the presence helper that stands for absence. Must
            match one of the helper's options exactly, including case.
          default: Away
          selector:
            text:
        preset_presenza:
          name: Preset to restore when the house is occupied
          description: >-
            Whatever your thermostat calls its normal, someone-is-home preset
            — "comfort", "home", "custom", "manual", depending on the brand.
            It is only ever applied when the thermostat is switched on while
            still in "away": a preset you chose yourself, such as "sleep", is
            left untouched.
          default: comfort
          selector:
            text:

mode: queued
max: 10

variables:
  termostato: !input termostato
  condizionatore: !input condizionatore

triggers:
  - trigger: state
    entity_id: !input termostato
    to: "off"
    id: "off"
    alias: Thermostat switched off
  - trigger: state
    entity_id: !input termostato
    to: heat
    id: heat
    alias: Thermostat set to heating
  - trigger: state
    entity_id: !input termostato
    to: cool
    id: cool
    alias: Thermostat set to cooling
  - trigger: state
    entity_id: !input termostato
    attribute: temperature
    id: temperature
    alias: Thermostat target temperature changed
  - trigger: state
    entity_id: !input sensore_finestra
    to: "on"
    id: window_open
    alias: Window opened
  - trigger: state
    entity_id: !input sensore_finestra
    to: "off"
    id: window_closed
    alias: Window closed

conditions: []

actions:
  - alias: Mirror the thermostat mode onto the air conditioner
    choose:
      - alias: Switch off
        conditions:
          - condition: trigger
            id:
              - "off"
        sequence:
          - action: climate.turn_off
            target:
              entity_id: !input condizionatore

      - alias: Heating
        conditions:
          - condition: trigger
            id:
              - heat
        sequence:
          - action: climate.set_hvac_mode
            target:
              entity_id: !input condizionatore
            data:
              hvac_mode: heat

      - alias: Cooling
        conditions:
          - condition: trigger
            id:
              - cool
        sequence:
          - action: climate.set_hvac_mode
            target:
              entity_id: !input condizionatore
            data:
              hvac_mode: cool

      - alias: Window opened
        conditions:
          - condition: trigger
            id:
              - window_open
          - alias: Only if the air conditioner is not already off
            condition: not
            conditions:
              - condition: state
                entity_id: !input condizionatore
                state: "off"
        sequence:
          - action: climate.turn_off
            target:
              entity_id: !input condizionatore

      - alias: Window closed
        conditions:
          - condition: trigger
            id:
              - window_closed
          - alias: Only if the thermostat is not off
            condition: not
            conditions:
              - condition: state
                entity_id: !input termostato
                state: "off"
        sequence:
          - action: climate.turn_on
            target:
              entity_id: !input condizionatore

  - alias: Nobody home — move the thermostat to the away preset
    if:
      - condition: state
        entity_id: !input helper_presenza
        state: !input stato_assenti
      - condition: trigger
        id:
          - heat
          - cool
          - window_closed
    then:
      - action: climate.set_preset_mode
        target:
          entity_id: !input termostato
        data:
          preset_mode: away

  - alias: Someone home — leave the away preset when the thermostat comes back on
    if:
      - alias: Only while the house is occupied
        condition: not
        conditions:
          - condition: state
            entity_id: !input helper_presenza
            state: !input stato_assenti
      - condition: trigger
        id:
          - heat
          - cool
          - window_closed
      - alias: Only if away is still stuck on it — never touches a preset you chose
        condition: state
        entity_id: !input termostato
        attribute: preset_mode
        state: away
    then:
      - action: climate.set_preset_mode
        target:
          entity_id: !input termostato
        data:
          preset_mode: !input preset_presenza

  - alias: Align the air conditioner target temperature with the thermostat
    if:
      - condition: trigger
        id:
          - temperature
          - heat
          - cool
      - alias: Only when the value to write differs from the one already set
        condition: template
        value_template: >-
          {% set th = state_attr(termostato, 'temperature') %}
          {% set ac = state_attr(condizionatore, 'temperature') %}
          {{ th is not none and (ac is none or (th | float) != (ac | float)) }}
    then:
      - action: climate.set_temperature
        target:
          entity_id: !input condizionatore
        data:
          temperature: "{{ state_attr(termostato, 'temperature') }}"
